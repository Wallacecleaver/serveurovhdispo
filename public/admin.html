<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin · Radar serveurs</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><h1>CONSOLE ADMIN</h1><p class="sub" id="sub"></p><div id="app"></div></main>
<script>
const $=id=>document.getElementById(id);
const api=async(p,b)=>{const r=await fetch('/api/admin'+p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur '+r.status);return d};
const say=(id,t,ok)=>{const e=$(id);e.className='note '+(ok?'good':'err');e.textContent=t};
async function boot(){const s=await api('/state');if(!s.authed)return gate(s.setup);panel()}
function gate(setup){$('sub').textContent=setup?'Connexion':'Première utilisation : choisis ton mot de passe admin (10 caractères min).';
$('app').innerHTML=`<div class="card" style="max-width:420px"><input type="text" class="pw" autocomplete="off" id="pw" placeholder="Mot de passe"><div class="bar" style="margin-top:.8rem"><button id="go">${setup?'Entrer':'Créer le compte admin'}</button><button type="button" class="ghost" id="eye">Voir</button></div><div id="m" class="note"></div></div>`;
const go=async()=>{try{await api(setup?'/login':'/setup',{password:$('pw').value});boot()}catch(e){say('m',e.message)}};$('go').onclick=go;$('eye').onclick=()=>$('pw').classList.toggle('show');$('pw').onkeydown=e=>e.key==='Enter'&&go()}
async function panel(){$('sub').textContent='Tout se règle ici, rien à mettre dans un fichier.';
$('app').innerHTML=`<h2>Statut</h2><div class="card"><div id="st">…</div><div class="bar" style="margin-top:.8rem"><button id="chk">Scanner maintenant</button><button class="ghost" id="pause"></button><button class="ghost" id="out">Déconnexion</button></div><div id="n1" class="note"></div></div>
<h2>Réglages</h2><div class="card"><div class="row2">
<div><label class="f">Clé API Brevo</label><input type="text" class="pw" autocomplete="off" id="brevoKey" autocomplete="off"></div>
<div><label class="f">Adresse expéditeur (validée dans Brevo)</label><input type="text" id="mailFrom"></div>
<div><label class="f">Token Hetzner (lecture seule)</label><input type="text" class="pw" autocomplete="off" id="hcloud" autocomplete="off"></div>
<div><label class="f">Webhook Discord (alertes directes, optionnel)</label><input type="text" class="pw" autocomplete="off" id="discord" autocomplete="off"></div>
<div><label class="f">URL publique</label><input type="url" id="publicUrl"></div></div>
<p class="meta">Un champ secret vide = inchangé. Pour en supprimer un, tape <b>-</b>.</p>
<button id="save">Enregistrer</button><div id="n2" class="note"></div>
<div class="bar" style="margin-top:1rem"><input type="email" id="to" placeholder="Envoyer un mail de test à…" style="max-width:300px"><button class="ghost" id="tm">Tester Brevo</button></div><div id="n3" class="note"></div></div>
<h2>Inscrits</h2><div class="card" id="subs">…</div>
<h2>Mot de passe</h2><div class="card"><div class="row2"><input type="text" class="pw" autocomplete="off" id="cur" placeholder="Actuel"><input type="text" class="pw" autocomplete="off" id="nxt" placeholder="Nouveau (10+)"></div><button id="cp" style="margin-top:.8rem">Changer</button><div id="n4" class="note"></div></div>`;
const SEC=['brevoKey','hcloud','discord'];
const cfg=await api('/config');let paused=cfg.paused;
for(const k of ['brevoKey','hcloud','discord','mailFrom','publicUrl']){const e=$(k);if(SEC.includes(k))e.placeholder=cfg[k]||'non configuré';else e.value=cfg[k]}
const pl=()=>$('pause').textContent=paused?'▶ Reprendre les alertes':'⏸ Pause des alertes';pl();
$('pause').onclick=async()=>{paused=!paused;await api('/config',{paused});pl()};
$('out').onclick=async()=>{await api('/logout',{});boot()};
$('save').onclick=async()=>{const b={mailFrom:$('mailFrom').value,publicUrl:$('publicUrl').value};for(const k of SEC){const v=$(k).value.trim();if(v==='-')b[k]=null;else if(v)b[k]=v}
try{await api('/config',b);say('n2','Enregistré ✔',1);for(const k of SEC)$(k).value='';panel()}catch(e){say('n2',e.message)}};
$('tm').onclick=async()=>{try{await api('/test-mail',{to:$('to').value});say('n3','Mail de test envoyé ✔',1)}catch(e){say('n3',e.message)}};
$('cp').onclick=async()=>{try{await api('/password',{current:$('cur').value,next:$('nxt').value});say('n4','Mot de passe changé ✔',1)}catch(e){say('n4',e.message)}};
$('chk').onclick=async()=>{$('chk').disabled=true;say('n1','Scan en cours…',1);try{await api('/check',{});say('n1','Scan terminé ✔',1);stat()}catch(e){say('n1',e.message)}$('chk').disabled=false};
stat();subsList()}
async function stat(){const {status:s,subs}=await api('/status');const f=(n,x)=>x?(x.ok?`<span class="tag ok">${n} · ${x.count} offres, ${x.available} dispo</span>`:`<span class="tag ko">${n} · ${x.error}</span>`):'';
$('st').innerHTML=`<div class="meta">Dernier scan : ${s.lastRun?new Date(s.lastRun).toLocaleString('fr-FR'):'jamais'} · ${subs} inscrit(s)</div><div class="bar">${f('OVH',s.ovh)} ${f('Hetzner',s.hetzner)}</div>${s.mailError?`<div class="err">Dernière erreur mail : ${s.mailError.replace(/</g,'&lt;')}</div>`:''}`}
async function subsList(){const l=await api('/subs');const b=$('subs');if(!l.length){b.textContent='Aucun inscrit.';return}
b.innerHTML='<table><tr><th>Email</th><th>Statut</th><th>Offres</th><th></th></tr>'+l.map(s=>`<tr><td></td><td>${s.confirmed?'confirmé':'en attente'}</td><td>${s.offers}</td><td><button class="red" data-id="${s.id}">Supprimer</button></td></tr>`).join('')+'</table>';
b.querySelectorAll('tr').forEach((tr,i)=>{if(i)tr.firstChild.textContent=l[i-1].email});
b.querySelectorAll('button').forEach(x=>x.onclick=async()=>{await api('/subs/'+x.dataset.id,{});subsList()})}
boot();
</script></body></html>
