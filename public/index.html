<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alertes serveurs OVH / Hetzner</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --card:#f5f6f8; --line:#dde0e5; --ok:#168a45; --ko:#b3261e; --accent:#2557d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#eceef1; --muted:#9aa0a8; --card:#1d2026; --line:#2d3139; --ok:#4cc380; --ko:#f2736b; --accent:#6c93ff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:680px; margin:0 auto; padding:2rem 1rem 4rem; }
  h1 { font-size:1.5rem; margin:0 0 .25rem; }
  .sub { color:var(--muted); margin:0 0 1.5rem; }
  h2 { font-size:1.05rem; margin:1.5rem 0 .5rem; }
  label.row { display:flex; gap:.6rem; align-items:center; padding:.6rem .75rem; background:var(--card); border:1px solid var(--line); border-radius:8px; margin-bottom:.4rem; cursor:pointer; }
  label.row .name { flex:1; }
  .loc { font-size:.8rem; color:var(--muted); }
  .badge { font-size:.75rem; font-weight:600; padding:.1rem .5rem; border-radius:99px; border:1px solid currentColor; }
  .badge.ok { color:var(--ok); } .badge.ko { color:var(--ko); }
  input[type=email] { width:100%; padding:.7rem; font-size:1rem; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); }
  button { margin-top:1rem; padding:.75rem 1.25rem; font-size:1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; }
  #msg { margin-top:1rem; min-height:1.5rem; }
  #msg.err { color:var(--ko); } #msg.good { color:var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Alertes serveurs</h1>
  <p class="sub">Un mail dès qu'un VPS OVH (Europe) ou Hetzner Cloud (Europe) est de nouveau disponible. Vérification toutes les 5 minutes.</p>

  <form id="f">
    <div id="list">Chargement…</div>
    <h2>Ton email</h2>
    <input type="email" id="email" placeholder="toi@exemple.com" required autocomplete="email">
    <button id="btn" type="submit">M'alerter</button>
    <div id="msg" role="status"></div>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
const NAMES = { ovh: 'OVH', hetzner: 'Hetzner Cloud' };

function el(tag, props = {}, ...kids) {
  const e = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => e.append(k));
  return e;
}

async function load() {
  try {
    const offers = await (await fetch('/api/offers')).json();
    const list = $('list');
    list.replaceChildren();
    if (!offers.length) { list.textContent = 'Aucune offre trouvée pour le moment.'; return; }
    for (const provider of ['ovh', 'hetzner']) {
      const group = offers.filter((o) => o.provider === provider);
      if (!group.length) continue;
      list.append(el('h2', { textContent: NAMES[provider] }));
      for (const o of group) {
        const ok = o.locations.length > 0;
        list.append(el('label', { className: 'row' },
          el('input', { type: 'checkbox', value: o.key, name: 'offer' }),
          el('span', { className: 'name' },
            o.label + (o.price ? ` · ${o.price} €/mois` : ''),
            ok ? el('div', { className: 'loc', textContent: o.locations.join(', ') }) : ''),
          el('span', { className: 'badge ' + (ok ? 'ok' : 'ko'), textContent: ok ? 'Dispo' : 'Indispo' })));
      }
    }
  } catch { $('list').textContent = 'Impossible de charger les offres.'; }
}

$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const offers = [...document.querySelectorAll('input[name=offer]:checked')].map((i) => i.value);
  const msg = $('msg'); msg.className = ''; msg.textContent = '';
  if (!offers.length) { msg.className = 'err'; msg.textContent = 'Coche au moins une offre.'; return; }
  $('btn').disabled = true;
  try {
    const r = await fetch('/api/subscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: $('email').value, offers }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'Erreur');
    msg.className = 'good'; msg.textContent = 'Presque fini : clique sur le lien dans le mail de confirmation.';
  } catch (err) { msg.className = 'err'; msg.textContent = err.message; }
  $('btn').disabled = false;
});

load();
</script>
</body>
</html>
