<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#151a45"/>
      <stop offset="0.6" stop-color="#0b0f2c"/>
      <stop offset="1" stop-color="#060814"/>
    </linearGradient>
    <linearGradient id="g" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4df0ff"/>
      <stop offset="0.55" stop-color="#3d9bff"/>
      <stop offset="1" stop-color="#9a6bff"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4df0ff" stop-opacity=".7"/>
      <stop offset="0.5" stop-color="#8a5cff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="7" y1="0" x2="51" y2="0">
      <stop offset="0" stop-color="#4df0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4df0ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="wedge" gradientUnits="userSpaceOnUse" x1="7" y1="0" x2="51" y2="0">
      <stop offset="0" stop-color="#4df0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4df0ff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.8"/></filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bg)"/>
  <rect x="1.6" y="1.6" width="60.8" height="60.8" rx="14.4" fill="none" stroke="url(#rim)" stroke-width="1.2"/>

  <!-- radar -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#8890d8" stroke-opacity=".28" stroke-width="1"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#8890d8" stroke-opacity=".5" stroke-width="2.4" stroke-dasharray="0.8 12.29" stroke-linecap="butt" transform="rotate(-90 32 32)"/>
  <path d="M32 32 L7 32 A25 25 0 0 1 51.15 15.93 Z" fill="url(#wedge)"/>
  <path d="M7 32 A25 25 0 0 1 51.15 15.93" fill="none" stroke="url(#sweep)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="51.15" cy="15.93" r="4.6" fill="#2dffa0" fill-opacity=".18"/>
  <circle cx="51.15" cy="15.93" r="2.3" fill="#2dffa0"/>

  <!-- W -->
  <path d="M16 22 L24 43 L32 29 L40 43 L48 22" fill="none" stroke="#6a5cff" stroke-opacity=".55" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M16 22 L24 43 L32 29 L40 43 L48 22" fill="none" stroke="url(#g)" stroke-width="5.4" stroke-linejoin="round" stroke-linecap="round"/>
